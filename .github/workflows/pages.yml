name: Documentation Pages

on:
  push:
    branches:
      - master
      - abuild-gh
  pull_request:
    branches:
      - master
      - abuild-gh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    pages-${{
      github.event_name == 'pull_request' && github.event.pull_request.number ||
      'deployment'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Spawn Manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the documentation
        shell: bash
        run: |
          .github/ci/run /bin/sh -c '
            set -eu
            test "$(id -u)" -ne 0
            make doc
          '

      - name: Verify the Pages tree
        shell: bash
        run: |
          set -euo pipefail
          test -s doc/html/index.html
          test -s doc/html/CHANGELOG.html
          test -s doc/html/WORK_QUEUE.html
          test -s doc/html/protocol-v1.html
          test -s doc/html/lifecycle-v1.html
          test -s doc/html/styles.css
          grep -Fq '<title>Ada Spawn Manager</title>' doc/html/index.html
          grep -Fq '<h1 id="ada-spawn-manager">Ada Spawn Manager</h1>' \
            doc/html/index.html
          grep -Fq 'github.com/abuild-project/spawn-manager' doc/html/index.html
          grep -Fq 'git.codelabs.ch/?p=spawn-manager.git' doc/html/index.html
          source_base_url='https://github.com/abuild-project/spawn-manager/blob/master'
          grep -Fq "href=\"$source_base_url/src/spawn-pool.ads\"" \
            doc/html/index.html
          if grep -Rq 'spawn-manager/blob/abuild/' doc/html; then
            echo 'Generated documentation still targets frozen abuild.' >&2
            exit 1
          fi
          grep -Fq '<h1 id="changelog">Changelog</h1>' \
            doc/html/CHANGELOG.html
          grep -Fq '<h1 id="spawn-manager-work-queue">' \
            doc/html/WORK_QUEUE.html
          grep -Fq '<h1 id="spawn-manager-protocol-version-1">' \
            doc/html/protocol-v1.html
          grep -Fq '<h1 id="spawn-manager-lifecycle-version-1">' \
            doc/html/lifecycle-v1.html
          unexpected_links=$(
            grep -h -Eo 'href="[^"]+"' doc/html/*.html |
              sed -e 's/^href="//' -e 's/"$//' |
              grep -Ev \
                -e '^#' \
                -e '^https?://' \
                -e '^mailto:' \
                -e '^index\.html($|#)' \
                -e '^CHANGELOG\.html($|#)' \
                -e '^WORK_QUEUE\.html($|#)' \
                -e '^protocol-v1\.html($|#)' \
                -e '^lifecycle-v1\.html($|#)' \
                -e '^styles\.css$' ||
              true
          )
          if test -n "$unexpected_links"; then
            echo 'Generated documentation contains unpublished local links:' >&2
            echo "$unexpected_links" >&2
            exit 1
          fi
          test -z "$(find doc/html -type l -print -quit)"

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc/html/
          retention-days: 7

  deploy-pages:
    name: Deploy GitHub Pages
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the documentation site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
